name: Update translations

# Pulls translations from Crowdin into a PR that merges itself once the required checks pass.
# The PR is opened by the repo's GitHub App rather than GITHUB_TOKEN: events from
# GITHUB_TOKEN don't trigger workflows (CI on the PR, build/publish after the merge),
# and github-actions can only approve a PR it didn't open itself.
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

# A manual run overlapping a scheduled one could push older translations over newer ones.
concurrency: update-translations

jobs:
  update-translations:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # approve the PR
    steps:
    - name: Get GitHub App token
      id: app
      uses: actions/create-github-app-token@v3
      with:
        app-id: ${{ secrets.BOT_APP_ID }}
        private-key: ${{ secrets.BOT_APP_KEY }}
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: 3.11
    - name: Run Python script
      run: python update.py
      working-directory: ./chameleonultragui/lib/l10n
      env:
        CROWDIN_API: ${{ secrets.CROWDIN_API }}
    # Rebuilds the branch from main and force-pushes it when there are changes, or
    # deletes it once main already has them.
    - name: Create PR
      id: cpr
      uses: peter-evans/create-pull-request@v8
      with:
        token: ${{ steps.app.outputs.token }}
        base: main
        branch: translations
        delete-branch: true
        # Commits through the API as the App. Otherwise the author defaults to
        # github.actor, which on scheduled runs is whoever last edited the cron line.
        sign-commits: true
        # Only translated files: never the English source, which Crowdin also exports.
        # This is what makes the auto-approval below safe.
        add-paths: |
          chameleonultragui/lib/l10n/app_*.arb
          :(exclude)chameleonultragui/lib/l10n/app_en.arb
        body: "Update translations"
        commit-message: "feat: Update translations"
        title: "feat: Update translations"
    # Runs for every open PR, not just changed ones: a push dismisses earlier approvals,
    # and a failed attempt gets retried. Auto-merge is enabled with the App token so
    # the merge triggers the push workflows on main.
    - name: Approve and enable auto-merge
      if: steps.cpr.outputs.pull-request-number != ''
      env:
        GH_REPO: ${{ github.repository }}
        PR: ${{ steps.cpr.outputs.pull-request-number }}
        ACTIONS_TOKEN: ${{ github.token }}
        APP_TOKEN: ${{ steps.app.outputs.token }}
      run: |
        GH_TOKEN="$ACTIONS_TOKEN" gh pr review "$PR" --approve
        GH_TOKEN="$APP_TOKEN" gh pr merge "$PR" --auto --squash
