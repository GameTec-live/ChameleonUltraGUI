name: Update translations

# Pulls translations from Crowdin into a PR that merges itself once the required checks pass.
# The PR is opened by the repo's GitHub App rather than GITHUB_TOKEN: events from
# GITHUB_TOKEN don't trigger workflows (CI on the PR, build/publish after the merge),
# and github-actions can only approve a PR it didn't open itself.
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push: # TEST ONLY
    branches: [t3/translations-app-test]

jobs:
  update-translations:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # approve the PR
    steps:
    - name: Get GitHub App token
      id: app
      uses: actions/create-github-app-token@v3
      with:
        app-id: ${{ secrets.BOT_APP_ID }}
        private-key: ${{ secrets.BOT_APP_KEY }}
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: 3.11
    - name: Run Python script
      run: python update.py
      working-directory: ./chameleonultragui/lib/l10n
      env:
        CROWDIN_API: ${{ secrets.CROWDIN_API }}
    - run: echo >> chameleonultragui/lib/l10n/app_th.arb && echo >> chameleonultragui/lib/l10n/app_en.arb # TEST ONLY: fake changes
    # Rebuilds the branch from main and force-pushes it when there are changes, or
    # deletes it once main already has them.
    - name: Create PR
      id: cpr
      uses: peter-evans/create-pull-request@v8
      with:
        token: ${{ steps.app.outputs.token }}
        branch: translations-test # TEST ONLY
        delete-branch: true
        # Only translated files: never the English source, which Crowdin also exports.
        # This is what makes the auto-approval below safe.
        add-paths: |
          chameleonultragui/lib/l10n/app_*.arb
          :(exclude)chameleonultragui/lib/l10n/app_en.arb
        body: "Update translations"
        commit-message: "feat: Update translations"
        title: "feat: Update translations"
    # A push dismisses earlier approvals, so approve on every update. Auto-merge is
    # enabled with the App token so the merge triggers the push workflows on main.
    - name: Approve and enable auto-merge
      if: steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated'
      env:
        GH_REPO: ${{ github.repository }}
        PR: ${{ steps.cpr.outputs.pull-request-number }}
        ACTIONS_TOKEN: ${{ github.token }}
        APP_TOKEN: ${{ steps.app.outputs.token }}
        GH_TOKEN: ${{ github.token }} # TEST ONLY: for gh pr view
      run: |
        # TEST ONLY: prove each call works without letting the PR merge
        GH_TOKEN="$APP_TOKEN" gh pr merge "$PR" --auto --squash
        gh pr view "$PR" --json author,autoMergeRequest,files --jq '{author:.author.login,auto:(.autoMergeRequest!=null),files:[.files[].path]}'
        GH_TOKEN="$APP_TOKEN" gh pr merge "$PR" --disable-auto
        GH_TOKEN="$ACTIONS_TOKEN" gh pr review "$PR" --approve
        gh pr view "$PR" --json reviewDecision,autoMergeRequest --jq '{reviewDecision,auto:(.autoMergeRequest!=null)}'
