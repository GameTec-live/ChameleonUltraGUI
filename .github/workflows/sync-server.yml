name: Sync server

# Builds the self-hosted sync server image (sync/server/Dockerfile) for amd64
# and arm64 on native runners. Pushes from main publish it to GHCR as
# ghcr.io/<owner>/cu-sync-server:latest and :sha-<commit>.
on:
  workflow_dispatch:
  push:
    paths: &paths
      - sync/server/**
      - sync/web/**
      - .github/workflows/sync-server.yml
  pull_request:
    paths: *paths

concurrency:
  group: sync-server-${{ github.ref }}
  cancel-in-progress: true

env:
  PUSH: ${{ github.ref == 'refs/heads/main' }}

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cu-sync-server" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: sync
          file: sync/server/Dockerfile
          platforms: linux/${{ matrix.arch }}
          # Untagged per-arch image; the publish job tags the combined manifest.
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ env.PUSH }}
          cache-from: type=gha,scope=sync-server-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=sync-server-${{ matrix.arch }}
      - if: env.PUSH == 'true'
        run: mkdir digests && touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - if: env.PUSH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: sync-server-digest-${{ matrix.arch }}
          path: digests/*
          retention-days: 1

  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: digests
          pattern: sync-server-digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - working-directory: digests
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cu-sync-server"
          digests=(*)
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --annotation "index:org.opencontainers.image.description=Self-hostable Chameleon Ultra GUI sync server" \
            --annotation "index:org.opencontainers.image.licenses=GPL-3.0" \
            -t "$image:latest" -t "$image:sha-${GITHUB_SHA::7}" \
            "${digests[@]/#/$image@sha256:}"
