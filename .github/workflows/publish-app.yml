name: Publish APP

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: publish-app
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./chameleonultragui
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 100
      - uses: actions/setup-java@v6
        with:
          distribution: "zulu"
          java-version: "21"
      - name: Load Secret
        uses: mobiledevops/secret-to-file-action@v1
        with:
          base64-encoded-secret: ${{ secrets.KEY_PROPERTIES }}
          filename: "key.properties"
          working-directory: "./chameleonultragui/android"
      - name: Load Secret
        uses: mobiledevops/secret-to-file-action@v1
        with:
          base64-encoded-secret: ${{ secrets.UPLOAD_KEYSTORE }}
          filename: "upload-keystore.jks"
          working-directory: "./chameleonultragui"
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
      - run: flutter pub get
      - run: flutter build appbundle --build-number ${{ github.run_number }}
      - uses: actions/upload-artifact@v7
        with:
          name: appbundle
          path: chameleonultragui/build/app/outputs/bundle/release/app-release.aab
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
      - name: Install dependencies
        run: bundle install
        working-directory: "./chameleonultragui/"
      - name: Load Secret
        uses: mobiledevops/secret-to-file-action@v1
        with:
          base64-encoded-secret: ${{ secrets.PLAYSTORE_KEY }}
          filename: "api-key.json"
          working-directory: "./chameleonultragui"
      - name: Fastlane Publishing on ${{ github.event.inputs.publish_track }}
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish_track != ''
        run: fastlane ${{ github.event.inputs.publish_track }}
        working-directory: "./chameleonultragui/"
      - name: Fastlane Publishing on production
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.publish_track == ''
        run: fastlane production
        working-directory: "./chameleonultragui/"
  build-macos:
    runs-on: macos-latest
    env:
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 100
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
      - name: Fix permissions
        run: sudo chown -R $USER . && sudo chmod -R a+rwx .
      - name: Enable macOS
        run: flutter config --enable-macos-desktop
      - name: Install tools
        run: brew install automake libtool create-dmg
      - name: Install Codemagic
        run: pip3 install codemagic-cli-tools==0.69.0 --break-system-packages
      - name: Export private key
        uses: mobiledevops/secret-to-file-action@v1
        with:
          base64-encoded-secret: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          filename: "AuthKey.p8"
          working-directory: "./chameleonultragui"
      - name: Export certificate
        uses: mobiledevops/secret-to-file-action@v1
        with:
          base64-encoded-secret: ${{ secrets.APP_STORE_CERTIFICATE }}
          filename: "cert_key"
          working-directory: "./chameleonultragui"
      - name: Initialize keychain and certificates
        working-directory: "./chameleonultragui"
        run: |
          export APP_STORE_CONNECT_PRIVATE_KEY=`cat AuthKey.p8`
          app-store-connect fetch-signing-files run.chameleon.gui --platform MAC_OS --type MAC_APP_STORE --certificate-key=@file:cert_key --create
          app-store-connect certificates list --type MAC_INSTALLER_DISTRIBUTION --certificate-key=@file:cert_key --save 2>&1 | grep -q 'Did not find' && app-store-connect certificates create --type MAC_INSTALLER_DISTRIBUTION --certificate-key=@file:cert_key --save
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
      - name: Pick macOS version
        working-directory: "./chameleonultragui"
        shell: bash
        run: |
          export APP_STORE_CONNECT_PRIVATE_KEY="$(cat AuthKey.p8)"
          APP_ID=$(app-store-connect apps list --bundle-id-identifier run.chameleon.gui --strict-match-identifier --json \
            | jq -er 'if length == 1 then .[0].id else error("Expected exactly one matching app") end')
          PUBSPEC_VERSION=$(sed -nE 's/^version: *([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml)
          VERSION=$(app-store-connect apps app-store-versions "$APP_ID" --platform MAC_OS --json \
            | jq -er --arg floor "$PUBSPEC_VERSION" -f "$GITHUB_WORKSPACE/.github/scripts/app-store-version.jq")
          echo "APP_ID=$APP_ID" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Build app
        working-directory: "./chameleonultragui"
        run: |
          sudo chown -R $USER . && sudo chmod -R a+rwx .
          flutter build macos --release --build-number ${{ github.run_number }} --build-name "$VERSION"
          sudo chown -R $USER . && sudo chmod -R a+rwx .
      - name: Sign package
        working-directory: "./chameleonultragui"
        run: |
          APP_NAME=$(find $(pwd) -name "*.app")
          PACKAGE_NAME=$(basename "$APP_NAME" .app).pkg
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> $GITHUB_ENV
          xcrun productbuild --component "$APP_NAME" /Applications/ unsigned.pkg
          INSTALLER_CERT_NAME=$(keychain list-certificates \
                    | jq '[.[]
                      | select(.common_name
                      | contains("Mac Developer Installer"))
                      | .common_name][0]' \
                    | xargs)
          xcrun productsign --sign "$INSTALLER_CERT_NAME" unsigned.pkg "$PACKAGE_NAME"
          sudo chown -R $USER . && sudo chmod -R a+rwx .
      - name: Upload package to App Store
        working-directory: "./chameleonultragui"
        run: |
          export APP_STORE_CONNECT_PRIVATE_KEY=`cat AuthKey.p8`
          app-store-connect publish --path "$PACKAGE_NAME"
      - name: Wait for processed macOS build
        id: processed
        timeout-minutes: 30
        working-directory: "./chameleonultragui"
        shell: bash
        run: |
          export APP_STORE_CONNECT_PRIVATE_KEY="$(cat AuthKey.p8)"
          BUILD_ID=""
          while [[ -z "$BUILD_ID" ]]; do
              BUILD_ID=$(app-store-connect builds list --app-id "$APP_ID" --platform MAC_OS \
                --build-version-number ${{ github.run_number }} --processing-state VALID --json \
                | jq -r 'if length > 1 then error("Expected at most one matching build") else .[0].id // empty end')
              if [[ -z "$BUILD_ID" ]]; then
                  echo "macOS build is not ready, retrying in 30 seconds..."
                  sleep 30
              fi
          done
          echo "BUILD_ID=$BUILD_ID" >> "$GITHUB_ENV"
      # TestFlight goes first and App Store runs regardless, so a stuck App
      # Store submission never holds back the open beta (or vice versa).
      - name: Submit to TestFlight
        working-directory: "./chameleonultragui"
        run: |
          export APP_STORE_CONNECT_PRIVATE_KEY=`cat AuthKey.p8`
          app-store-connect builds submit-to-testflight "$BUILD_ID"
          app-store-connect beta-groups add-build "$BUILD_ID" --beta-group "Open beta testing"
      - name: Submit to App Store
        if: ${{ !cancelled() && steps.processed.outcome == 'success' }}
        working-directory: "./chameleonultragui"
        run: |
          export APP_STORE_CONNECT_PRIVATE_KEY=`cat AuthKey.p8`
          app-store-connect builds submit-to-app-store --cancel-previous-submissions --platform=MAC_OS --version-string="$VERSION" --whats-new="Compiled from `git log --pretty=format:%s --oneline --ancestry-path HEAD~1..HEAD`" "$BUILD_ID"
  build-ios:
    runs-on: macos-latest
    env:
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 100
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
      - name: Install tools
        run: brew install automake libtool create-dmg
      - name: Install Codemagic
        run: pip3 install codemagic-cli-tools==0.69.0 --break-system-packages
      - name: Export private key
        uses: mobiledevops/secret-to-file-action@v1
        with:
          base64-encoded-secret: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          filename: "AuthKey.p8"
          working-directory: "./chameleonultragui"
      - name: Export certificate
        uses: mobiledevops/secret-to-file-action@v1
        with:
          base64-encoded-secret: ${{ secrets.APP_STORE_CERTIFICATE }}
          filename: "cert_key"
          working-directory: "./chameleonultragui"
      - name: Initialize keychain and certificates
        working-directory: "./chameleonultragui"
        run: |
          export APP_STORE_CONNECT_PRIVATE_KEY=`cat AuthKey.p8`
          app-store-connect fetch-signing-files $(xcode-project detect-bundle-id) --platform IOS --type IOS_APP_STORE --certificate-key=@file:cert_key --create
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
      - name: Pick iOS version
        working-directory: "./chameleonultragui"
        shell: bash
        run: |
          export APP_STORE_CONNECT_PRIVATE_KEY="$(cat AuthKey.p8)"
          APP_ID=$(app-store-connect apps list --bundle-id-identifier run.chameleon.gui --strict-match-identifier --json \
            | jq -er 'if length == 1 then .[0].id else error("Expected exactly one matching app") end')
          PUBSPEC_VERSION=$(sed -nE 's/^version: *([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml)
          VERSION=$(app-store-connect apps app-store-versions "$APP_ID" --platform IOS --json \
            | jq -er --arg floor "$PUBSPEC_VERSION" -f "$GITHUB_WORKSPACE/.github/scripts/app-store-version.jq")
          echo "APP_ID=$APP_ID" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Build app
        working-directory: "./chameleonultragui"
        run: |
          flutter build ipa --release --export-options-plist=$HOME/export_options.plist --build-number ${{ github.run_number }} --build-name "$VERSION"
      # App Store signed; sideloading tools (AltStore, Sideloadly, ...) re-sign it.
      - uses: actions/upload-artifact@v7
        with:
          name: ipa
          path: chameleonultragui/build/ios/ipa/*.ipa
      - name: Upload app to App Store
        working-directory: "./chameleonultragui"
        run: |
          export APP_STORE_CONNECT_PRIVATE_KEY=`cat AuthKey.p8`
          app-store-connect publish --path $(find $(pwd) -name "*.ipa")
      - name: Wait for processed iOS build
        id: processed
        timeout-minutes: 30
        working-directory: "./chameleonultragui"
        shell: bash
        run: |
          export APP_STORE_CONNECT_PRIVATE_KEY="$(cat AuthKey.p8)"
          BUILD_ID=""
          while [[ -z "$BUILD_ID" ]]; do
              BUILD_ID=$(app-store-connect builds list --app-id "$APP_ID" --platform IOS \
                --build-version-number ${{ github.run_number }} --processing-state VALID --json \
                | jq -r 'if length > 1 then error("Expected at most one matching build") else .[0].id // empty end')
              if [[ -z "$BUILD_ID" ]]; then
                  echo "iOS build is not ready, retrying in 30 seconds..."
                  sleep 30
              fi
          done
          echo "BUILD_ID=$BUILD_ID" >> "$GITHUB_ENV"
      # TestFlight goes first and App Store runs regardless, so a stuck App
      # Store submission never holds back the open beta (or vice versa).
      - name: Submit to TestFlight
        working-directory: "./chameleonultragui"
        run: |
          export APP_STORE_CONNECT_PRIVATE_KEY=`cat AuthKey.p8`
          app-store-connect builds submit-to-testflight "$BUILD_ID"
          app-store-connect beta-groups add-build "$BUILD_ID" --beta-group "Open beta testing"
      - name: Submit to App Store
        if: ${{ !cancelled() && steps.processed.outcome == 'success' }}
        working-directory: "./chameleonultragui"
        run: |
          export APP_STORE_CONNECT_PRIVATE_KEY=`cat AuthKey.p8`
          app-store-connect builds submit-to-app-store --cancel-previous-submissions --platform=IOS --version-string="$VERSION" --whats-new="Compiled from `git log --pretty=format:%s --oneline --ancestry-path HEAD~1..HEAD`" "$BUILD_ID"
