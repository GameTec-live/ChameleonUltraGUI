# Keeps marketplace.json in sync with plugins/ and marketplace.config.json.
# Pull requests are only validated; the default branch also gets the
# regenerated manifest committed back.
name: Marketplace

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Runs one at a time, so each run checks out the previous run's commit.
concurrency: marketplace-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node build-marketplace.js
      - name: Commit marketplace.json
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        run: |
          git add marketplace.json
          git diff --cached --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update marketplace.json'
          git push
