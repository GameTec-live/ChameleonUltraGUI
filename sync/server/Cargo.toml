[package]
name = "cu-sync-server"
version = "0.1.0"
edition = "2024"
description = "Self-hostable sync server for Chameleon Ultra GUI (see ../PROTOCOL.md)"
license = "GPL-3.0"
publish = false

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
tower-http = { version = "0.7.1", features = ["cors"] }
